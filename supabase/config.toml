# Supabase local/CLI config for HomeAsset edge functions.
# invite-submit is public (token-gated) — contractors are not signed in.

[functions.invite-submit]
verify_jwt = false

[functions.ai-assist]
verify_jwt = true

[functions.send-push]
verify_jwt = true

# Cron / ops secret (RECALL_SCAN_SECRET) — not a user JWT.
[functions.monthly-recall-scan]
verify_jwt = false
